# СИНТЕТИЧНА політика оцінки. Виробничим калібруванням не є.
#
# Навіщо вона існує. Позитивна гілка оцінки — єдине місце, де продукт друкує
# число, і доводити її прозою методики означало б доводити текстом про те, що
# продукт друкує число, а не тим, що він його друкує правильно. Тому пороги
# тут проставлені, арифметика на них рахується, і результат відомий заздалегідь.
#
# Чому це безпечно. `calibration.synthetic: true` — машинна мітка, і вона
# доходить до самої відповіді: у виданій оцінці з цією політикою серед обмежень
# стоїть рядок «політика синтетична (тестова фікстура), виробничим калібруванням
# не є». Переплутати таку відповідь із виробничою неможливо, не читаючи її.
#
# Виробнича політика — config/estimates.yaml, і в ній пороги лишаються null,
# доки не будуть виміряні.

schema_version: "1.0.0"

policy_commit: "0000000000000000000000000000000000000000"
policy_id: "synthetic-fixture-1"

interval:
  level: 0.95
  method: "wilson"
  z: 1.959963984540054
  display_decimals: 1

cohort:
  # Значення підібрані під синтетичну когорту з десяти рішень: вони
  # перевіряють гілку, а не калібрують продукт.
  min_decisions: 10
  max_interval_width: 0.6
  validity:
    max_unknown_share: 0.3
    require_complete_enumeration: true

stopping_profile:
  min_valid_runs: 5
  k_of_n: 3
  swap_consistency: 0.8
  criterion_threshold: 2.0
  hold_out_size: 5
  novelty_window: 2

calibration:
  status: "synthetic"
  linked_outcomes: 0
  measured_at: ""
  # Головна мітка цього файла. Читається кодом і доходить до відповіді.
  synthetic: true
