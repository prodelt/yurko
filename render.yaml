# Прод Yurko — **юридичне середовище**, а не інженерний стенд.
#
# Рішення власника 11.09.2026: прод має нести повний набір інструментів МСП,
# щоб юрист працював з міжнародним правом повноцінно. До того цей файл описував
# стенд, який у профілі `legal` не стартував узагалі (ProfileViolation), і
# `list_coverage` віддавав `legal_acceptance: false` — тобто юрист бачив
# продукт, який сам про себе каже, що юридичної приймання не проходив.
#
# Що змінилося і чого це коштує:
#
# * **Ембединги вимкнені.** `EMBEDDING_PROVIDER=null`: жоден текст запиту не
#   йде до Google (принцип VIII). Ціна — пошук українським корпусом лише
#   повнотекстовий, без векторів. Міжнародне право це не зачіпає: EUR-Lex
#   (Cellar), CURIA, HUDOC і МС ООН читаються адаптерами напряму, і бази для
#   цього не потрібно.
# * **База оголошена власною.** `YURKO_OWN_DATABASE=1` — свідчення власника, що
#   Postgres під його контролем. У базі лежить **публічне право**: 39 актів,
#   6487 статей. Матеріалів справи там немає й бути не може — ядро їх не
#   отримує взагалі (принцип VI, у контракті немає поля файла чи шляху).
# * **Каталог виводу відсутній.** `YURKO_HOSTED=1`: розміщене ядро не пише в
#   робочий каталог власного процесу. Каталог сервера сховищем справи не є, і
#   запис туди був би тихою підміною згоди на обробку матеріалів. Юрист
#   зберігає результат у себе.
# * **Групи інструментів відкриті всі.** Без цього доступна лише `evidence`, і
#   юрист не має ані друку документа, ані задачі, ані мут-корту.
services:
  - type: web
    name: ukraine-laws-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: UKRAINE_LAWS_API_KEY
        generateValue: true
      - key: MCP_TRANSPORT
        value: http
      - key: PYTHONUNBUFFERED
        value: "1"

      # --- юридичний профіль -------------------------------------------------
      # Значення за замовчуванням і так `legal`, але тут воно стоїть явно: цей
      # файл — заява про те, яким середовищем є прод, а заява не робиться
      # замовчуванням.
      - key: YURKO_PROFILE
        value: legal

      - key: YURKO_HOSTED
        value: "1"

      # --- сховище публічного права ------------------------------------------
      - key: USE_PG_BACKEND
        value: "1"
      # Ставиться в дашборді Render:
      # URI пулера транзакцій Supabase: користувач postgres.<ref>, хост aws-0-eu-west-1.pooler.supabase.com, порт 6543
      - key: DATABASE_URL
        sync: false
      # Свідчення власника, що ця база під його контролем (yurko_profile.py).
      # Без нього профіль `legal` не стартує: хостована база в потоці запиту —
      # порушення принципу VIII, і мовчки його обходити не можна.
      - key: YURKO_OWN_DATABASE
        value: "1"

      # --- ембединги ---------------------------------------------------------
      # `null` — жодного зовнішнього виклику при обслуговуванні запиту.
      - key: EMBEDDING_PROVIDER
        value: "null"

      # Ключ Gemini оголошений **порожнім навмисно**, і це не те саме, що не
      # згадати його зовсім. Змінна, яку блупринт не називає, лишається в
      # дашборді такою, як була: сервіс уже має цей ключ від часів інженерного
      # стенда, і після переходу на профіль `legal` він зупиняв би старт
      # (`ProfileViolation`) — тобто деплой ламав би працюючий прод, а виправити
      # це міг би лише той, у кого є дашборд.
      #
      # Порожнє значення — заява конфігурації: на сервері цього ключа немає.
      # Обслуговування запиту ембедингів не рахує взагалі, а завантаження
      # корпусу (`ingest.yml`) — окремий процес зі своїм секретом у GitHub, і
      # його це не зачіпає.
      - key: GOOGLE_API_KEY
        value: ""
