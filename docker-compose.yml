# Local dev backend for the Postgres feature flag (USE_PG_BACKEND=1).
# Mirrors Supabase (Postgres + pgvector) for offline development & tests.
#
#   docker compose up -d postgres
#   export DATABASE_URL=postgresql://postgres:pg@localhost:5432/ukraine_laws
#   python scripts/ingest.py --all --ensure-schema

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: ukraine_laws
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ukraine_laws"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
